name: ocicl CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        implementation: ['sbcl'] # ['abcl', 'clisp', 'ecl', 'sbcl']
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
    runs-on: '${{ matrix.os }}'
    name: 'Install Common Lisp'
    defaults:
      run:
        shell: bash
    steps:

    - uses: actions/checkout@v5

    - name: Install deps (MacOS via Homebrew)
      if: runner.os == 'macos'
      run: |
        brew install sbcl ocicl
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"

    - name: Install deps (Linux via Homebrew)
      if: runner.os == 'Linux'
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew install sbcl ocicl
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"

    - name: Install deps (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        choco install -y sbcl openssl.light
        echo "C:\Program Files\OpenSSL\bin" | Out-File $env:GITHUB_PATH -Append
        # OCICL (Download from GitHub Releases)
        $version = "2.20.0"
        $url = "https://github.com/ocicl/ocicl/releases/download/v$version/ocicl-$version-windows-amd64.zip"
        $installDir = "$env:RUNNER_TEMP\ocicl"

        New-Item -ItemType Directory -Force -Path $installDir | Out-Null

        Invoke-WebRequest `
          -Uri $url `
          -OutFile "$env:RUNNER_TEMP\ocicl.zip"

        Expand-Archive `
          -Path "$env:RUNNER_TEMP\ocicl.zip" `
          -DestinationPath $installDir `
          -Force

        # Make ocicl available to subsequent GitHub Actions steps
        Add-Content -Path $env:GITHUB_PATH -Value $installDir

    - name: Download the open-test jar
      run: curl -o open-test.jar https://repo1.maven.org/maven2/org/opentest4j/reporting/open-test-reporting-cli/0.2.7/open-test-reporting-cli-0.2.7-standalone.jar

    - name: Install OCICL dependencies and build
      run: |
        ocicl setup
        # retry, as downloads from ghcr.io occasionally get their connection reset
        for i in 1 2 3; do ocicl install && break; [ "$i" = 3 ] && exit 1; sleep 10; done
        ./build.sh

    - name: Run Tests
      run: ./test.sh -html

    - name: Upload HTML Test Report
      id: html_preview
      if: always()
      uses: pavi2410/html-preview-action@v5
      with:
        html_file: unit-tests.html
        job_summary: true

    - name: Link to HTML Test Report
      if: always() && steps.html_preview.outputs.artifact_url != ''
      env:
        REPORT_URL: ${{ steps.html_preview.outputs.artifact_url }}
      run: |
        echo "## HTML Test Report" >> "$GITHUB_STEP_SUMMARY"
        echo "[Open or download the report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
